name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4']
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Run tests
              run: make test

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: xdebug

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Run tests with coverage
              env:
                  XDEBUG_MODE: coverage
              run: make coverage-clover

            - name: Require 100% coverage
              run: |
                  php -r '
                      $xml = new SimpleXMLElement(file_get_contents("clover.xml"));
                      $metrics = $xml->project->metrics;
                      $statements = (int) $metrics["statements"];
                      $covered = (int) $metrics["coveredstatements"];
                      $percent = 0 === $statements ? 0.0 : $covered / $statements * 100;
                      printf("Coverage: %.2f%% (%d/%d statements)%s", $percent, $covered, $statements, PHP_EOL);
                      exit($covered === $statements && $statements > 0 ? 0 : 1);
                  '
